[project]
name = "nids"
version = "0.1.0"
description = "Default template for PDM package"
authors = [
    {name = "HanuP69", email = "honeypandey680@gmail.com"},
]
dependencies = ["scikit-learn>=1.7.2", "torch>=2.9.1", "fastapi>=0.128.0", "uvicorn>=0.40.0", "catboost>=1.2.8"]
requires-python = "==3.10.*"
readme = "README.md"
license = {text = "MIT"}


[tool.pdm]
distribution = false
plugins = ["pdm-plugin-torch"]

[[tool.pdm.source]]
type = "find_links"
url = "https://download.pytorch.org/whl/cu126"
name = "torch"
